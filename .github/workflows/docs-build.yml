name: docs build

on:
  pull_request:
  workflow_dispatch:

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build docs
        run: yarn build

      - name: Check docs llms.txt
        run: |
          file=build/llms.txt
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty"
            exit 1
          fi
          count=$(grep -cE '^- \[[^]]+\]\(https://docs\.swmansion\.com/react-native-screens-docs/[^)]+\)' "$file" || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::$file lists no pages"
            exit 1
          fi
          echo "llms.txt lists $count pages"